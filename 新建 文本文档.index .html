<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>致黄思韵 · 军训结束啦</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 25%, #e1bee7 55%, #ce93d8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* =========================================================
     一、樱花 + 彩带飘落 Canvas
  ========================================================= */
  #petalCanvas {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* =========================================================
     二、烟花画布
  ========================================================= */
  #fireworksCanvas {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* =========================================================
     三、开场动画
  ========================================================= */
  #introOverlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(circle at center, #fff5ee 0%, #ffe4d6 55%, #ffd4c2 100%);
    animation: introExit 0.9s ease 3.4s forwards;
  }

  @keyframes introExit {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100%); opacity: 0; visibility: hidden; }
  }

  .dot-field {
    position: absolute;
    inset: -10%;
    z-index: 1;
    background-image:
      radial-gradient(circle, #ff9eb5 18%, transparent 19%),
      radial-gradient(circle, #ffd166 18%, transparent 19%),
      radial-gradient(circle, #8ecaff 18%, transparent 19%),
      radial-gradient(circle, #b5f0c8 18%, transparent 19%);
    background-size: 120px 120px;
    background-position: 0 0, 60px 60px, 30px 90px, 90px 30px;
    opacity: 0;
    animation: dotsRush 3.2s ease-out forwards;
  }

  @keyframes dotsRush {
    0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    20% { opacity: 0.75; }
    70% { opacity: 0.45; transform: scale(1) rotate(0deg); }
    100% { opacity: 0.3; transform: scale(1.1) rotate(5deg); }
  }

  .glow-burst {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #fff5ee 25%, transparent 65%);
    z-index: 2;
    opacity: 0;
    animation: burst 1.2s ease-out 0.2s forwards;
  }

  @keyframes burst {
    0% { opacity: 0; transform: scale(0.2); }
    40% { opacity: 0.9; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  .intro-title {
    position: relative;
    z-index: 10;
    text-align: center;
    font-family: 'Impact', 'Arial Black', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  .intro-line1 {
    font-size: clamp(3rem, 12vw, 7rem);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 8px;
    -webkit-text-stroke: 5px #1a1a1a;
    paint-order: stroke fill;
    text-shadow:
      0 6px 0 #ff8fa8,
      0 12px 0 #d95d7a,
      0 18px 22px rgba(0,0,0,0.35);
    opacity: 0;
    animation: lineIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               lineWobble 1.6s ease-in-out 1.1s infinite;
  }

  @keyframes lineIn {
    0% { opacity: 0; transform: translateX(-100vw) rotate(-30deg) scale(0.4); }
    60% { opacity: 1; transform: translateX(15px) rotate(6deg) scale(1.15); }
    80% { transform: translateX(-8px) rotate(-3deg) scale(0.96); }
    100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
  }

  @keyframes lineWobble {
    0%, 100% { transform: rotate(-1.5deg) translateY(0); }
    50% { transform: rotate(1.5deg) translateY(-6px); }
  }

  .intro-line2 {
    font-size: clamp(1.8rem, 7vw, 3.6rem);
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 10px;
    margin-top: 0.6rem;
    background: #ffd166;
    display: inline-block;
    padding: 0.15em 0.7em;
    border-radius: 18px;
    border: 5px solid #1a1a1a;
    box-shadow: 0 8px 0 #1a1a1a;
    opacity: 0;
    animation: line2In 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards,
               line2Pulse 1.2s ease-in-out 1.8s infinite;
  }

  @keyframes line2In {
    0% { opacity: 0; transform: translateX(100vw) rotate(25deg) scale(0.3); }
    65% { opacity: 1; transform: translateX(-12px) rotate(-6deg) scale(1.12); }
    100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
  }

  @keyframes line2Pulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.06) rotate(-2deg); }
  }

  .intro-star {
    position: absolute;
    z-index: 11;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: #ffd166;
    text-shadow: 0 0 18px #ff9eb5, 0 0 30px #ff8fa8;
    opacity: 0;
    animation: starIn 0.6s ease-out forwards, starSpin 2s linear infinite;
  }

  @keyframes starIn {
    0% { opacity: 0; transform: scale(0) rotate(-180deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes starSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .star-1 { top: 12%; left: 12%; animation-delay: 1.6s, 2.2s; }
  .star-2 { top: 15%; right: 12%; animation-delay: 1.75s, 2.35s; }
  .star-3 { bottom: 16%; left: 15%; animation-delay: 1.9s, 2.5s; }
  .star-4 { bottom: 14%; right: 14%; animation-delay: 2.05s, 2.65s; }
  .star-5 { top: 50%; left: 50%; margin: -1.2rem 0 0 -1.2rem; animation-delay: 2.2s, 2.8s; }

  /* =========================================================
     四、星光背景
  ========================================================= */
  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
  }

  .star {
    position: absolute;
    background: #fff0f5;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffb6c1, 0 0 18px #ffc0cb;
    animation: twinkle 3s infinite alternate ease-in-out;
  }

  @keyframes twinkle {
    0% { opacity: 0.15; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1.5); }
  }

  /* =========================================================
     五、页面切换容器
  ========================================================= */
  .page-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 820px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    display: none;
    width: 100%;
    animation: pageIn 0.6s ease both;
  }

  .page.active {
    display: block;
  }

  @keyframes pageIn {
    from { opacity: 0; transform: scale(0.96) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* =========================================================
     六、中文主卡片
  ========================================================= */
  .card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 780px;
    background: rgba(255, 240, 245, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 2px solid rgba(255, 143, 168, 0.55);
    border-radius: 42px;
    padding: 3.2rem 2.5rem;
    text-align: center;
    box-shadow:
      0 30px 60px -15px rgba(206, 147, 216, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 0 40px rgba(255, 182, 193, 0.4);
    animation: cardGlow 5s infinite alternate, cardFloat 6s ease-in-out infinite;
    margin: 0 auto;
  }

  @keyframes cardGlow {
    0% { box-shadow: 0 30px 60px -15px rgba(206,147,216,0.5), 0 0 0 1px #ffffff99 inset, 0 0 30px #ffb6c155; }
    100% { box-shadow: 0 35px 70px -10px rgba(206,147,216,0.7), 0 0 0 2px #fff0f5cc inset, 0 0 60px #ff8fa866; }
  }

  @keyframes cardFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  .main-title {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: 6px;
    margin-bottom: 0.8rem;
    font-family: 'Impact', 'Arial Black', 'PingFang SC', sans-serif;
    background: linear-gradient(90deg, #ff5e9c, #ff8fa8, #ce93d8, #ff5e9c);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleShine 4s infinite, titlePulse 3s infinite alternate;
  }

  @keyframes titleShine {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes titlePulse {
    0% { filter: drop-shadow(0 4px 12px #ff8fa866); }
    100% { filter: drop-shadow(0 6px 22px #ce93d8aa); }
  }

  .subhead {
    font-size: 1.1rem;
    color: #ad6b8e;
    letter-spacing: 2px;
    margin-bottom: 2.2rem;
    border-bottom: 1px dashed #ff8fa8aa;
    padding-bottom: 1.2rem;
    display: inline-block;
    animation: fadeUp 1.2s ease 0.3s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .blessing-box {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 32px;
    padding: 2rem 1.8rem;
    margin: 1.8rem 0 2rem;
    border-left: 6px solid #ff8fa8;
    border-right: 6px solid #ce93d8;
    box-shadow: 0 0 30px #ff8fa833, inset 0 0 15px #fff0f5;
    text-align: left;
    position: relative;
    overflow: hidden;
    animation: fadeUp 1.2s ease 0.5s both;
  }

  .blessing-box::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 182, 193, 0.35), transparent);
    animation: shineSweep 5s infinite;
  }

  @keyframes shineSweep {
    0% { left: -100%; }
    60%, 100% { left: 200%; }
  }

  .blessing-text {
    font-size: 1.5rem;
    line-height: 1.8;
    font-weight: 500;
    color: #4a2c3a;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    position: relative;
    z-index: 1;
  }

  .blessing-text .highlight {
    color: #ff5e9c;
    font-weight: 700;
    text-shadow: 0 0 10px #ff8fa8aa;
    animation: highlightGlow 1.6s infinite alternate;
  }

  @keyframes highlightGlow {
    0% { text-shadow: 0 0 6px #ff8fa8aa; }
    100% { text-shadow: 0 0 18px #ff5e9c, 0 0 26px #ce93d8; }
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 1.8rem;
    background: #ff5e9c;
    margin-left: 6px;
    vertical-align: middle;
    animation: blink 0.9s step-end infinite;
    box-shadow: 0 0 12px #ff5e9c;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .signature {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.2rem;
    color: #ad6b8e;
    font-size: 1rem;
    letter-spacing: 1.5px;
    animation: fadeUp 1.2s ease 0.8s both;
  }

  .divider {
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff8fa8, #ce93d8, #ff8fa8, transparent);
    min-width: 80px;
    animation: dividerPulse 3s infinite;
  }

  @keyframes dividerPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .badge span {
    background: rgba(255, 255, 255, 0.7);
    border: 1.5px solid #ff8fa8aa;
    padding: 8px 20px;
    border-radius: 60px;
    font-weight: 600;
    color: #ad3d6e;
    font-size: 0.95rem;
    backdrop-filter: blur(4px);
    transition: all 0.3s;
    display: inline-block;
    box-shadow: 0 4px 12px #ff8fa833;
  }

  .badge span:hover {
    background: #ff8fa833;
    box-shadow: 0 0 18px #ff8fa8aa;
    transform: translateY(-2px);
  }

  .military-tag {
    display: inline-block;
    background: rgba(255, 255, 255, 0.8);
    color: #ad3d6e;
    padding: 0.3rem 1.2rem;
    border-radius: 30px;
    font-size: 0.9rem;
    letter-spacing: 1px;
    border: 1.5px solid #ce93d8aa;
    margin-bottom: 0.8rem;
    font-weight: 700;
    animation: tagGlow 2.5s infinite alternate;
  }

  @keyframes tagGlow {
    0% { box-shadow: 0 0 5px #ce93d844; }
    100% { box-shadow: 0 0 20px #ff8fa8aa; }
  }

  .signature-name {
    margin-top: 1.6rem;
    color: #ff5e9c;
    font-size: 1.05rem;
    letter-spacing: 2px;
    font-weight: 600;
    animation: fadeUp 1.2s ease 1s both, namePulse 3s infinite alternate;
  }

  @keyframes namePulse {
    0% { text-shadow: 0 0 6px #ff8fa866; }
    100% { text-shadow: 0 0 16px #ff5e9c, 0 0 24px #ce93d8aa; }
  }

  .action-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 1rem;
  }

  .replay-btn, .switch-btn {
    background: #ffffff;
    border: 2px solid #ff5e9c;
    color: #ff5e9c;
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    cursor: pointer;
    box-shadow: 0 6px 16px #ff8fa855;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
  }

  .switch-btn {
    border-color: #ce93d8;
    color: #a35bb5;
    box-shadow: 0 6px 16px #ce93d855;
  }

  .replay-btn:hover {
    background: #ff5e9c;
    color: #ffffff;
    box-shadow: 0 0 25px #ff5e9c;
    transform: scale(1.05);
  }

  .switch-btn:hover {
    background: #ce93d8;
    color: #ffffff;
    box-shadow: 0 0 25px #ce93d8;
    transform: scale(1.05);
  }

  .replay-btn:active, .switch-btn:active { transform: scale(0.98); }

  /* =========================================================
     七、英文玻璃卡片页（无人物版）
  ========================================================= */
  .glass-card {
    position: relative;
    width: 100%;
    background: rgba(255, 240, 248, 0.55);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 38px;
    padding: 3rem 2.4rem 3.4rem;
    box-shadow:
      0 30px 70px -15px rgba(206, 147, 216, 0.65),
      0 0 0 1px rgba(255, 255, 255, 0.7) inset,
      0 0 60px rgba(255, 182, 193, 0.5);
    overflow: hidden;
    text-align: center;
    margin: 0 auto;
  }

  .glass-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -20%;
    width: 60%;
    height: 200%;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
    transform: rotate(15deg);
    animation: glassShine 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes glassShine {
    0%, 100% { left: -30%; }
    50% { left: 110%; }
  }

  .bow-top {
    display: block;
    width: 90px;
    margin: 0 auto 1.2rem;
    animation: bowSwing 3s ease-in-out infinite;
    transform-origin: center bottom;
  }

  @keyframes bowSwing {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  .en-title {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.2;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff8fb0, #ff5e9c, #ce93d8, #ff8fb0);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.4rem;
    animation: titleShine 5s linear infinite;
    text-shadow: 0 4px 20px rgba(255, 143, 168, 0.35);
  }

  .en-message {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(1rem, 2vw, 1.35rem);
    line-height: 2;
    color: #4a2c3a;
    margin: 1.6rem auto 2rem;
    max-width: 520px;
    position: relative;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.7);
  }

  .en-message p {
    margin-bottom: 1.2rem;
  }

  .en-message .quote {
    color: #a35bb5;
    font-style: italic;
    padding: 0 0.4rem;
  }

  .en-message .highlight-line {
    color: #ff5e9c;
    font-weight: 700;
    font-size: 1.05em;
  }

  /* 纯 CSS 装饰：打字机 + 小樱花 + 星星 */
  .glass-decor {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 1rem;
    gap: 1rem;
    z-index: 2;
  }

  .glass-decor .deco-left,
  .glass-decor .deco-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .glass-decor .deco-left { margin-right: auto; }
  .glass-decor .deco-right { margin-left: auto; }

  /* CSS 画的小樱花 */
  .mini-sakura {
    width: 34px;
    height: 34px;
    position: relative;
    animation: miniSakuraFloat 3s ease-in-out infinite;
  }

  .mini-sakura .petal {
    position: absolute;
    width: 14px;
    height: 18px;
    background: linear-gradient(180deg, #ffd1e0, #ff9ec4);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    left: 50%;
    top: 50%;
    transform-origin: 0% 100%;
    border: 1px solid rgba(255, 120, 170, 0.55);
  }

  .mini-sakura .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
  .mini-sakura .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(72deg); }
  .mini-sakura .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(144deg); }
  .mini-sakura .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(216deg); }
  .mini-sakura .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(288deg); }

  .mini-sakura .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    background: #ffd166;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  @keyframes miniSakuraFloat {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-8px) rotate(8deg); }
  }

  /* CSS 画的小星星 */
  .mini-star {
    width: 22px;
    height: 22px;
    background: #ffd166;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: miniStarTwinkle 2s ease-in-out infinite;
    filter: drop-shadow(0 0 6px #ffd166);
  }

  @keyframes miniStarTwinkle {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
    50% { transform: scale(1.2) rotate(20deg); opacity: 1; }
  }

  /* CSS 画的小爱心 */
  .mini-heart {
    width: 24px;
    height: 22px;
    position: relative;
    animation: miniHeartBeat 1.6s ease-in-out infinite;
  }

  .mini-heart::before,
  .mini-heart::after {
    content: '';
    position: absolute;
    top: 0;
    width: 12px;
    height: 18px;
    background: #ff5e9c;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 0 8px #ff8fa8aa;
  }

  .mini-heart::before {
    left: 12px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
  }

  .mini-heart::after {
    left: 12px;
    transform: rotate(45deg);
    transform-origin: 0 100%;
  }

  @keyframes miniHeartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* 打字机（简化为 CSS 形状） */
  .mini-typewriter {
    width: 60px;
    height: 44px;
    position: relative;
    animation: miniTypewriterFloat 4s ease-in-out infinite;
  }

  .mini-typewriter .paper {
    position: absolute;
    top: 0; left: 8px;
    width: 44px; height: 20px;
    background: #fff;
    border: 2px solid #3a2a1a;
    border-radius: 2px;
  }

  .mini-typewriter .paper::before,
  .mini-typewriter .paper::after {
    content: '';
    position: absolute;
    left: 4px;
    right: 4px;
    height: 1.5px;
    background: #ccc;
  }

  .mini-typewriter .paper::before { top: 5px; }
  .mini-typewriter .paper::after { top: 11px; }

  .mini-typewriter .body {
    position: absolute;
    bottom: 0; left: 0;
    width: 60px; height: 26px;
    background: #6b7ba8;
    border: 2px solid #3a2a1a;
    border-radius: 4px;
  }

  .mini-typewriter .body::before {
    content: '';
    position: absolute;
    top: 4px; left: 6px; right: 6px;
    height: 8px;
    background: #4a5a85;
    border-radius: 2px;
  }

  .mini-typewriter .body::after {
    content: '';
    position: absolute;
    bottom: 3px; left: 8px; right: 8px;
    height: 4px;
    background: repeating-linear-gradient(90deg, #c8d0e0 0 3px, transparent 3px 5px);
  }

  @keyframes miniTypewriterFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  .back-btn {
    margin-top: 1.6rem;
    background: #ffffff;
    border: 2px solid #ce93d8;
    color: #a35bb5;
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    cursor: pointer;
    box-shadow: 0 6px 16px #ce93d855;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
  }

  .back-btn:hover {
    background: #ce93d8;
    color: #ffffff;
    box-shadow: 0 0 25px #ce93d8;
    transform: scale(1.05);
  }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .card { padding: 2rem 1.2rem; border-radius: 28px; }
    .main-title { font-size: 1.8rem; letter-spacing: 3px; }
    .blessing-text { font-size: 1.15rem; line-height: 1.7; }
    .cursor { height: 1.4rem; }
    .subhead { font-size: 0.9rem; }
    .intro-line1 { letter-spacing: 4px; }
    .intro-line2 { letter-spacing: 6px; }
    .glass-card { padding: 2rem 1.2rem 2.4rem; border-radius: 28px; }
    .en-title { font-size: 1.6rem; }
    .en-message { font-size: 1rem; line-height: 1.9; }
    .mini-typewriter { width: 44px; height: 32px; }
    .mini-typewriter .paper { width: 32px; height: 14px; }
    .mini-typewriter .body { width: 44px; height: 20px; }
    .mini-sakura { width: 26px; height: 26px; }
    .mini-star { width: 16px; height: 16px; }
    .mini-heart { width: 18px; height: 16px; }
  }
</style>
</head>
<body>

  <!-- ========== 樱花 + 彩带 ========== -->
  <canvas id="petalCanvas"></canvas>

  <!-- ========== 烟花 ========== -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- ========== 星光 ========== -->
  <div class="stars" id="starfield"></div>

  <!-- ========== 开场动画 ========== -->
  <div id="introOverlay">
    <div class="dot-field"></div>
    <div class="glow-burst"></div>

    <div class="intro-title">
      <div class="intro-line1">黄思韵</div>
      <div class="intro-line2">军训结束啦</div>
    </div>

    <div class="intro-star star-1">★</div>
    <div class="intro-star star-2">★</div>
    <div class="intro-star star-3">★</div>
    <div class="intro-star star-4">★</div>
    <div class="intro-star star-5">★</div>
  </div>

  <!-- ========== 页面切换 ========== -->
  <div class="page-wrap">

    <!-- 页面 1：中文 -->
    <div class="page active" id="pageChinese">
      <div class="card">
        <div class="military-tag">⚔️ 迷彩青春 · 顺利杀青 ⚔️</div>
        <h1 class="main-title">黄思韵，军训结束啦</h1>
        <div class="subhead">—— 献给还算坚韧的思韵 ——</div>

        <div class="blessing-box">
          <div class="blessing-text" id="blessingMessage"></div>
        </div>

        <div class="signature">
          <span class="badge"><span>🌿 教官 · 再见</span></span>
          <div class="divider"></div>
          <span class="badge"><span>🎖️ 黄思韵 · 未来可期</span></span>
        </div>

        <div class="signature-name">—— 智浩 敬上 ——</div>

        <div class="action-row">
          <button class="replay-btn" id="replayBtn">
            <span>⟳</span> 重温祝福
          </button>
          <button class="switch-btn" id="goEnglish">
            🌸 英文卡片
          </button>
        </div>
      </div>
    </div>

    <!-- 页面 2：英文玻璃卡片（无人物） -->
    <div class="page" id="pageEnglish">
      <div class="glass-card">

        <svg class="bow-top" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffb3d1"/>
              <stop offset="50%" stop-color="#ff8fb0"/>
              <stop offset="100%" stop-color="#ff5e9c"/>
            </linearGradient>
          </defs>
          <ellipse cx="38" cy="38" rx="30" ry="22" fill="url(#bowGrad)" stroke="#ff5e9c" stroke-width="2"/>
          <ellipse cx="82" cy="38" rx="30" ry="22" fill="url(#bowGrad)" stroke="#ff5e9c" stroke-width="2"/>
          <ellipse cx="60" cy="38" rx="12" ry="12" fill="#ff8fb0" stroke="#ff5e9c" stroke-width="2"/>
          <path d="M 40 60 L 55 55" stroke="#ff5e9c" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 80 60 L 65 55" stroke="#ff5e9c" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>

        <h2 class="en-title">When you light up the day</h2>

        <div class="en-message">
          <p>
            <span class="quote">"When the dawn breaks and the stars fade,</span><br>
            <span class="quote">joy and warmth stay beside you."</span>
          </p>
          <p class="highlight-line">May all your wishes come true</p>
          <p class="highlight-line">and happiness always be with you.</p>
        </div>

        <!-- 纯 CSS 装饰替代人物 -->
        <div class="glass-decor">
          <div class="deco-left">
            <!-- 小打字机 -->
            <div class="mini-typewriter">
              <div class="paper"></div>
              <div class="body"></div>
            </div>
            <!-- 小樱花 -->
            <div class="mini-sakura">
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="core"></span>
            </div>
          </div>

          <div class="deco-right">
            <!-- 小星星 -->
            <div class="mini-star"></div>
            <!-- 小爱心 -->
            <div class="mini-heart"></div>
            <!-- 小星星 -->
            <div class="mini-star" style="animation-delay: 0.6s;"></div>
          </div>
        </div>

        <button class="back-btn" id="goChinese">← 回到中文祝福</button>
      </div>
    </div>

  </div>

<script>
  /* =========================================================
     一、樱花 + 彩带飘落
  ========================================================= */
  (function() {
    const canvas = document.getElementById('petalCanvas');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;

    function resizeCanvas() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    if (W === 0 || H === 0) {
      setTimeout(resizeCanvas, 100);
    }

    class Sakura {
      constructor() { this.reset(true); }
      reset(initial) {
        this.x = Math.random() * W;
        this.y = initial ? Math.random() * H : -Math.random() * 200 - 30;
        this.size = Math.random() * 14 + 10;
        this.speedY = Math.random() * 1.8 + 0.8;
        this.speedX = Math.random() * 1 - 0.5;
        this.sway = Math.random() * 2 + 1;
        this.swayPhase = Math.random() * Math.PI * 2;
        this.swaySpeed = Math.random() * 0.02 + 0.01;
        this.rotate = Math.random() * Math.PI * 2;
        this.rotateSpeed = (Math.random() - 0.5) * 0.05;
        this.opacity = Math.random() * 0.4 + 0.6;
        const pinkList = ['#ffd1e0', '#ffb7d0', '#ff9ec4', '#ffc4d8', '#ffb3cc'];
        this.color = pinkList[Math.floor(Math.random() * pinkList.length)];
        this.petals = 5;
      }
      update() {
        this.y += this.speedY;
        this.swayPhase += this.swaySpeed;
        this.x += this.speedX + Math.sin(this.swayPhase) * this.sway;
        this.rotate += this.rotateSpeed;
        if (this.y > H + 40) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotate);
        ctx.globalAlpha = this.opacity;

        const r = this.size / 2;
        for (let i = 0; i < this.petals; i++) {
          ctx.save();
          ctx.rotate((Math.PI * 2 / this.petals) * i);
          ctx.beginPath();
          ctx.ellipse(0, -r * 0.55, r * 0.38, r * 0.62, 0, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 120, 170, 0.55)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = '#ff8fb0';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, r * 0.1, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd166';
        ctx.fill();

        ctx.restore();
      }
    }

    class Ribbon {
      constructor() { this.reset(true); }
      reset(initial) {
        this.x = Math.random() * W;
        this.y = initial ? Math.random() * H : -Math.random() * 200 - 30;
        this.width = Math.random() * 5 + 3;
        this.height = Math.random() * 22 + 14;
        this.speedY = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.sway = Math.random() * 1.8 + 0.8;
        this.swayPhase = Math.random() * Math.PI * 2;
        this.swaySpeed = Math.random() * 0.03 + 0.01;
        this.rotate = Math.random() * Math.PI * 2;
        this.rotateSpeed = (Math.random() - 0.5) * 0.1;
        this.opacity = Math.random() * 0.35 + 0.65;
        const colorList = [
          '#ff5e9c', '#ff8fa8', '#ffd166', '#ffcc33',
          '#5ec8ff', '#3b8fd0', '#7bffb5', '#2ed573',
          '#ba68c8', '#ce93d8', '#ff78a6', '#ff9ff3'
        ];
        this.color = colorList[Math.floor(Math.random() * colorList.length)];
      }
      update() {
        this.y += this.speedY;
        this.swayPhase += this.swaySpeed;
        this.x += this.speedX + Math.sin(this.swayPhase) * this.sway;
        this.rotate += this.rotateSpeed;
        if (this.y > H + 40) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotate);
        ctx.globalAlpha = this.opacity;

        ctx.fillStyle = this.color;
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width * 0.35, this.height);

        ctx.beginPath();
        ctx.moveTo(-this.width / 2, this.height / 2);
        ctx.lineTo(0, this.height / 2 - this.width * 0.6);
        ctx.lineTo(this.width / 2, this.height / 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        ctx.restore();
      }
    }

    const sakuras = [];
    const ribbons = [];
    const sakuraCount = W < 600 ? 35 : 70;
    const ribbonCount = W < 600 ? 30 : 60;
    for (let i = 0; i < sakuraCount; i++) sakuras.push(new Sakura());
    for (let i = 0; i < ribbonCount; i++) ribbons.push(new Ribbon());

    function animate() {
      ctx.clearRect(0, 0, W, H);

      for (let r of ribbons) {
        r.update();
        r.draw();
      }
      for (let s of sakuras) {
        s.update();
        s.draw();
      }

      requestAnimationFrame(animate);
    }
    animate();
  })();

  /* =========================================================
     二、烟花引擎
  ========================================================= */
  (function() {
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));

    const particles = [];
    const rockets = [];
    const GRAVITY = 0.06;
    const FRICTION = 0.985;

    const COLORS = [
      '#ff4d6d', '#ff758f', '#ffb3c1', '#ff5e9c',
      '#ffd166', '#ffcc33', '#ffaa33',
      '#5ec8ff', '#3b8fd0', '#7bffb5', '#2ed573',
      '#ba68c8', '#e1bee7', '#ffffff'
    ];

    function randomColor() {
      return COLORS[Math.floor(Math.random() * COLORS.length)];
    }

    function explode(x, y, baseColor) {
      const count = 90 + Math.floor(Math.random() * 50);
      const color = baseColor || randomColor();
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 3;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.01 + Math.random() * 0.012,
          color,
          size: Math.random() * 3 + 2,
          gravity: GRAVITY,
          friction: FRICTION,
          trail: []
        });
      }
      for (let i = 0; i < 25; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 10 + 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.018 + Math.random() * 0.02,
          color: '#ffffff',
          size: Math.random() * 2 + 1,
          gravity: GRAVITY * 0.5,
          friction: FRICTION,
          trail: []
        });
      }
    }

    function launchRocket(targetX, targetY) {
      const startX = W / 2 + (Math.random() - 0.5) * W * 0.4;
      const startY = H;
      rockets.push({
        x: startX,
        y: startY,
        targetX: targetX !== undefined ? targetX : W / 2 + (Math.random() - 0.5) * W * 0.6,
        targetY: targetY !== undefined ? targetY : H * 0.15 + Math.random() * H * 0.45,
        color: randomColor(),
        trail: [],
        progress: 0
      });
    }

    function fireAt(x, y) { launchRocket(x, y); }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function animate() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(252, 228, 236, 0.12)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.progress += 0.04;
        const curX = r.x + (r.targetX - r.x) * Math.min(r.progress, 1);
        const curY = r.y + (r.targetY - r.y) * Math.min(r.progress, 1);
        r.trail.push({ x: curX, y: curY });
        if (r.trail.length > 14) r.trail.shift();
        for (let j = 0; j < r.trail.length; j++) {
          const t = r.trail[j];
          const alpha = j / r.trail.length * 0.9;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 220, 160, ${alpha})`;
          ctx.fill();
        }
        if (r.progress >= 1) {
          explode(r.targetX, r.targetY, r.color);
          rockets.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 8) p.trail.shift();

        for (let j = 0; j < p.trail.length; j++) {
          const t = p.trail[j];
          const alpha = (j / p.trail.length) * p.life * 0.6;
          ctx.beginPath();
          ctx.arc(t.x, t.y, p.size * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = hexToRgba(p.color, alpha);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(p.color, p.life);
        ctx.shadowBlur = 20;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(animate);
    }

    animate();

    document.addEventListener('click', function(e) {
      if (e.target.closest('.replay-btn')) return;
      if (e.target.closest('.switch-btn')) return;
      if (e.target.closest('.back-btn')) return;
      fireAt(e.clientX, e.clientY);
    });

    document.addEventListener('touchstart', function(e) {
      const t = e.touches[0];
      if (!t) return;
      if (e.target.closest('.replay-btn')) return;
      if (e.target.closest('.switch-btn')) return;
      if (e.target.closest('.back-btn')) return;
      fireAt(t.clientX, t.clientY);
    }, { passive: true });

    setTimeout(function autoFireworks() {
      fireAt(W * 0.3, H * 0.35);
      setTimeout(() => fireAt(W * 0.7, H * 0.3), 400);
      setTimeout(() => fireAt(W * 0.5, H * 0.25), 800);
    }, 4200);

    window.triggerFireworks = function() {
      fireAt(W * 0.25, H * 0.3);
      setTimeout(() => fireAt(W * 0.75, H * 0.35), 300);
      setTimeout(() => fireAt(W * 0.5, H * 0.2), 600);
      setTimeout(() => fireAt(W * 0.4, H * 0.4), 900);
      setTimeout(() => fireAt(W * 0.6, H * 0.3), 1200);
    };

    document.getElementById('replayBtn').addEventListener('click', function() {
      setTimeout(() => window.triggerFireworks(), 200);
    });
  })();

  /* =========================================================
     三、星光
  ========================================================= */
  (function() {
    const starfield = document.getElementById('starfield');
    const count = window.innerWidth < 600 ? 70 : 130;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
      star.style.opacity = (Math.random() * 0.5 + 0.4);
      starfield.appendChild(star);
    }
  })();

  /* =========================================================
     四、打字机祝福（中文）
  ========================================================= */
  (function() {
    const blessingEl = document.getElementById('blessingMessage');
    const fullMessage = '嘿 <span class="highlight">黄思韵</span>，军训终于熬完啦！🎉<br>晒黑没？反正你本来也挺黑的哈哈。<br>不过说真的，能坚持下来已经很顶了。<br>别人晒成炭，你晒成<span class="highlight">高光</span>✨<br>这段迷彩日子，以后想起来绝对带感。<br>接下来，时间自由、躺平自由、统统耍起！<br>祝你能尽快完美进阶韩师！<br>—— 智浩';

    let typingTimer = null;
    let tokenIndex = 0;
    let isTyping = false;

    function parseMessage(html) {
      const tokens = [];
      const regex = /(<[^>]+>)|([^<])/g;
      let match;
      while ((match = regex.exec(html)) !== null) {
        if (match[1]) tokens.push({ type: 'tag', value: match[1] });
        else if (match[2]) tokens.push({ type: 'char', value: match[2] });
      }
      return tokens;
    }

    const tokens = parseMessage(fullMessage);
    const totalTokens = tokens.length;

    function renderWithCursor() {
      let html = '';
      for (let i = 0; i < tokenIndex; i++) html += tokens[i].value;
      blessingEl.innerHTML = html + '<span class="cursor"></span>';
    }

    function scheduleNextToken() {
      if (tokenIndex >= totalTokens) {
        isTyping = false;
        setTimeout(() => {
          if (window.triggerFireworks) window.triggerFireworks();
        }, 400);
        return;
      }
      const t = tokens[tokenIndex];
      let delay = 80;
      if (t.type === 'tag') delay = 10;
      else if (['，', '。', '！', '？', '；', '：'].includes(t.value)) delay = 180;
      else if (t.value === ' ') delay = 30;
      else delay = 70 + Math.random() * 40;

      typingTimer = setTimeout(() => {
        if (!isTyping) return;
        tokenIndex++;
        renderWithCursor();
        scheduleNextToken();
      }, delay);
    }

    function startTyping() {
      if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
      tokenIndex = 0;
      isTyping = true;
      blessingEl.innerHTML = '';
      renderWithCursor();
      scheduleNextToken();
    }

    document.getElementById('replayBtn').addEventListener('click', function() {
      if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
      isTyping = false;
      startTyping();
    });

    setTimeout(startTyping, 4300);
  })();

  /* =========================================================
     五、页面切换
  ========================================================= */
  (function() {
    const pageChinese = document.getElementById('pageChinese');
    const pageEnglish = document.getElementById('pageEnglish');
    const goEnglish = document.getElementById('goEnglish');
    const goChinese = document.getElementById('goChinese');

    function switchTo(target) {
      pageChinese.classList.remove('active');
      pageEnglish.classList.remove('active');
      target.classList.add('active');
      if (window.triggerFireworks) setTimeout(() => window.triggerFireworks(), 150);
    }

    goEnglish.addEventListener('click', () => switchTo(pageEnglish));
    goChinese.addEventListener('click', () => switchTo(pageChinese));
  })();
</script>
